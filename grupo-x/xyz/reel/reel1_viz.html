<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>XYZ · Reel 1 · Visualizer</title>
<meta name="viewport" content="width=1080">
<style>
:root{--bg:#000;--fg:#f4f4f2;--ac:#39ff14;--dim:#6b6b68}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
body.ov,body.ov #stage{background:transparent!important}body.ov #scan{display:none}
#stage{position:relative;width:1080px;height:1920px;background:#000;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px)}
.tag{position:absolute;font:600 26px "JetBrains Mono",monospace;letter-spacing:.18em;color:var(--dim)}
#top{top:92px;left:72px}#credit{top:92px;right:72px;font-size:22px}
#txt{position:absolute;left:72px;right:72px;top:150px;height:1000px;display:flex;flex-direction:column;justify-content:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;color:var(--fg);text-transform:uppercase;line-height:.98;letter-spacing:-.02em;white-space:pre-line}
#txt .ac{color:var(--ac);text-shadow:0 0 28px rgba(57,255,20,.55)}
#sub{position:absolute;left:72px;right:72px;top:1000px}
#bar{position:absolute;left:0;bottom:0;height:8px;background:var(--ac);width:0}
</style></head><body>
<div id="stage">
 <canvas id="bg" width="1080" height="1920"></canvas>
 <div id="scan"></div>
 <div class="tag" id="top">XYZ SOCIAL CLUB</div>
 <div class="tag" id="credit">♪ BUKELE · FANTA ROSARIO × BIZARRAP</div>
 <div id="txt"></div>
 <div id="sub"></div>
 <div id="bar"></div>
</div>
<script src="viz1_data.js"></script>
<script>const OV=location.search.includes('overlay');if(OV)document.body.classList.add('ov');</script>
<script>
const BAR=1.984*1000;                       // one bar = 4 beats of the track (≈121 BPM), ms
const BEAT=BAR/4;
const S=[
 {a:0,     b:2*BAR, size:150, lines:["SOMOS LAS","ÚLTIMAS","LETRAS."], ac:[2]},
 {a:2*BAR, b:3*BAR, size:170, lines:["NADIE NOS","FIRMÓ."], ac:[1]},
 {a:3*BAR, b:4*BAR, size:170, lines:["NADIE NOS","ESPERABA."], ac:[1]},
 {a:4*BAR, b:5*BAR, size:150, lines:["POR ESO LO","HACEMOS","JUNTOS."], ac:[2]},
 {a:5*BAR, b:6*BAR, size:150, roles:["ARTISTA","PRODUCTOR","VISUAL","FAN"]},
 {a:6*BAR, b:16000, size:300, lines:["XYZ."], ac:[0], sub:["Los últimos serán","los primeros."], link:"LINK EN BIO ↓"}
];
window.__total=16000;
const V=window.VIZ, NB=V.bands[0].length;
const G="▓▒░█#@%&XYZ/\\<>01";
function rnd(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)}
const txt=document.getElementById('txt'),sub=document.getElementById('sub'),bar=document.getElementById('bar');
const cv=document.getElementById('bg'),c=cv.getContext('2d');
function decode(str,t,seed,per=38){
  let out='';
  for(let i=0;i<str.length;i++){const ch=str[i];if(ch===' '){out+=ch;continue}
    const r=i*per+120;
    if(t>=r+160)out+=ch;else if(t>=r-120)out+=G[Math.floor(rnd(seed+i+Math.floor(t/45))*G.length)];else out+=' ';}
  return out;
}
function fr(T){return Math.min(V.bass.length-1,Math.max(0,Math.round(T/1000*V.fps)))}
function drawViz(T,f,pulse,idx){
  c.clearRect(0,0,1080,1920);
  if(!OV){c.fillStyle='#000';c.fillRect(0,0,1080,1920);
    const g=c.createRadialGradient(540,640,0,540,640,900);
    g.addColorStop(0,`rgba(20,70,10,${0.28+0.5*pulse})`);g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g;c.fillRect(0,0,1080,1920);}
  else{ // over a video: soft dark gradients so text and bars stay readable, pulse with the kick
    const t=c.createLinearGradient(0,0,0,1250);t.addColorStop(0,'rgba(0,0,0,.55)');t.addColorStop(1,'rgba(0,0,0,.15)');c.fillStyle=t;c.fillRect(0,0,1080,1250);
    const b=c.createLinearGradient(0,1250,0,1920);b.addColorStop(0,'rgba(0,0,0,.1)');b.addColorStop(1,'rgba(0,0,0,.7)');c.fillStyle=b;c.fillRect(0,1250,1080,670);
    c.fillStyle=`rgba(57,255,20,${0.05*pulse})`;c.fillRect(0,0,1080,1920);}
  // concentric rings pulsing with the kick, centred behind the text
  for(let k=0;k<4;k++){
    const ph=((T/BEAT)+k*.25)%1, r=120+ph*700+pulse*90;
    c.strokeStyle=`rgba(57,255,20,${(1-ph)*(0.10+0.25*pulse)})`;c.lineWidth=3+pulse*5;
    c.beginPath();c.arc(540,640,r,0,Math.PI*2);c.stroke();
  }
  // mirrored spectrum, bottom third: bars grow up from a centre baseline
  const base=1680, n=NB, w=1080/ (n*2), gap=4;
  for(let i=0;i<n;i++){
    const v=V.bands[f][i], h=18+v*340;
    const a=0.35+0.65*v;
    c.fillStyle=`rgba(57,255,20,${a})`;
    // left half mirrors the right so the low end sits in the middle
    const xr=540+i*w, xl=540-(i+1)*w;
    for(const x0 of [xr,xl]){
      c.fillRect(x0+gap/2,base-h,w-gap,h);
      c.fillStyle=`rgba(244,244,242,${0.10+0.20*v})`;c.fillRect(x0+gap/2,base+14,w-gap,h*0.32);   // faint reflection
      c.fillStyle=`rgba(57,255,20,${a})`;
    }
    if(v>0.7){c.fillStyle='#f4f4f2';c.fillRect(xr+gap/2,base-h-12,w-gap,6);c.fillRect(xl+gap/2,base-h-12,w-gap,6)}
  }
  // beat ticks along the top of the bar block
  const bt=((T/BEAT)%1);
  c.fillStyle=`rgba(244,244,242,${0.5*(1-bt)})`;c.fillRect(0,base+4,1080,3);
  // grain
  if(!OV)for(let k=0;k<260;k++){const v=rnd(k+Math.floor(T/66)*7.3)*255;c.fillStyle=`rgba(${v},${v},${v},.10)`;c.fillRect(rnd(k*3.1+Math.floor(T/66))*1080,rnd(k*5.7+Math.floor(T/66)*2)*1920,3,3)}
}
window.__seek=function(T){
  const f=fr(T), pulse=V.bass[f];
  const s=S.find(x=>T>=x.a&&T<x.b)||S[S.length-1], t=T-s.a, idx=S.indexOf(s), dur=s.b-s.a;
  drawViz(T,f,pulse,idx);
  const fade=Math.min(1,(dur-t)/110)*Math.min(1,t/40+0.15);
  const hit=pulse>.75?(rnd(f)-.5)*10:0;                    // glitch jitter on strong bass hits
  txt.style.transform=`translateX(${hit}px) scale(${1+0.035*pulse+0.03*t/dur})`;
  txt.style.opacity=(idx===S.length-1)?1:fade;
  txt.style.fontSize=s.size+'px';
  let html='';
  if(s.roles){
    const per=BEAT, cur=Math.min(s.roles.length-1,Math.floor(t/per));
    html=s.roles.map((r,i)=>`<div class="${i===cur?'ac':''}" style="opacity:${i<=cur?(i===cur?1:.28):0}">${i===cur?decode(r,t-i*per,500+i*40,22):r}</div>`).join('');
  } else {
    html=s.lines.map((l,i)=>`<div class="${s.ac&&s.ac.includes(i)?'ac':''}">${decode(l,Math.max(0,t-i*170),idx*100+i*10)}</div>`).join('');
  }
  txt.innerHTML=html;
  if(s.sub){
    sub.style.opacity=Math.min(1,Math.max(0,t-700)/300);
    sub.innerHTML=`<div style="font:700 70px 'Bricolage Grotesque';color:#f4f4f2;line-height:1.05">${s.sub.join('<br>')}</div><div style="margin-top:36px;font:600 32px 'JetBrains Mono';letter-spacing:.2em;color:var(--ac)">${s.link}</div>`;
  } else sub.innerHTML='';
  bar.style.width=(T/window.__total*100)+'%';
};
window.__seek(0);
</script></body></html>
