<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;background:#000}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#0d1a0a 0,#000 70%)}
canvas{position:absolute;inset:0}
.w{position:absolute;left:60px;font-family:"Bricolage Grotesque","IPAGothic",sans-serif;font-weight:800;line-height:.9;letter-spacing:-.03em;color:#39ff14;text-shadow:0 0 40px rgba(57,255,20,.35)}
.t{position:absolute;font:600 28px "JetBrains Mono",monospace;letter-spacing:.2em;color:#8a8a86}
</style></head><body><div id="c"><canvas id="g" width="1080" height="1920"></canvas>
<div class="t" style="left:60px;top:330px">XYZ SOCIAL CLUB</div>
<div class="w" style="top:380px;font-size:250px">Últimos</div>
<div class="w" style="top:640px;font-size:250px;color:#f4f4f2;text-shadow:none">Last</div>
<div class="w" style="top:900px;font-size:250px">Primeros</div>
<div class="w" style="top:1190px;font-size:250px;left:300px;color:#f4f4f2;text-shadow:none">最初</div>
<div class="t" style="left:60px;top:1560px;color:#f4f4f2;font-size:30px">COMENTA TU PALABRA ↓</div>
<script>
const c=document.getElementById('g').getContext('2d');
function r(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)}
for(let k=0;k<9000;k++){const v=r(k)*255;c.fillStyle=`rgba(${v},${v},${v},.09)`;c.fillRect(r(k*3.1)*1080,r(k*5.7)*1920,3,3)}
</script></div></body></html>
