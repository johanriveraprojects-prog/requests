<title>Grupo X Reel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@400;600&family=Instrument+Sans:wght@400;600&display=swap">
<style>
/* Layout: a fixed 1080x1920 (9:16) stage driven by one clock, scaled to fit the window.
   Content stays inside Instagram/TikTok safe zones. Single dark look by choice. */
:root {
  color-scheme: dark;
  --ink: #0a0a0a;
  --ink-2: #0a0a0a;
  --line: #2c2c2c;
  --paper: #f2f2f2;
  --muted: #9c9c9c;
  --accent: #f2f2f2;
  --ok: #4fd1a5;
  --warn: #f2b84b;
  --bad: #ff6b6b;
  --f-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Instrument Sans", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
html, body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--f-body); }
body { padding-inline: 16px; padding-block: 16px; }
.page { max-width: 560px; margin-inline: auto; display: grid; gap: 12px; }
.frame { position: relative; width: min(100%, calc((100vh - 150px) * 9 / 16)); aspect-ratio: 9 / 16; margin-inline: auto; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--ink-2); }
.stage { container-type: inline-size; position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; background: var(--ink-2); overflow: hidden; }
#bg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.grid-bg { display: none; position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 8cqw 8cqw; opacity: .22; mask-image: radial-gradient(ellipse at 60% 35%, #000, transparent 75%); }
.stage[data-bg="grid"] .grid-bg { display: block; }

.story { position: absolute; left: 6cqw; right: 6cqw; top: 6cqw; display: flex; gap: 1.2cqw; }
.story i { flex: 1; height: .9cqw; background: var(--line); border-radius: 1cqw; overflow: hidden; }
.story i b { display: block; height: 100%; width: 100%; background: var(--paper); transform-origin: left; transform: scaleX(0); }
.scene { position: absolute; inset: 0; display: grid; align-content: center; justify-items: start; padding: 16cqw 8cqw 38cqw; gap: 5cqw; opacity: 0; visibility: hidden; }
.scene.on { visibility: visible; }
.tag { font-family: var(--f-mono); font-size: 2.88cqw; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1, h2 { font-family: var(--f-display); margin: 0; line-height: .95; text-wrap: balance; letter-spacing: -.02em; }
h1 { font-size: 17.60cqw; font-weight: 800; }
h2 { font-size: 8.80cqw; font-weight: 800; }
.sub { font-size: 4.00cqw; color: var(--muted); line-height: 1.35; }

@keyframes rise { from { opacity: 0; transform: translateY(4cqw); } to { opacity: 1; transform: none; } }
@keyframes blink { 50% { opacity: 0; } }
.on .rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s); }

/* Grupo X: monochrome like the logo. One white on black, hierarchy through size and opacity. */
.scene.center { justify-items: center; text-align: center; }
.logo { display: block; width: 46cqw; height: auto; filter: drop-shadow(0 0 3cqw rgba(255,255,255,.28)); }
.logo.sm { width: 24cqw; }
.brand { font-family: var(--f-mono); font-size: 3.06cqw; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
.hook { font-size: 6.40cqw; max-width: 82cqw; }
.on .logo.pop { animation: pop 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.82) rotate(-6deg); } to { opacity: 1; transform: none; } }
/* niche scene: audience dots converge into one ring */
.field { position: relative; width: 84cqw; height: 62cqw; }
.dot { position: absolute; left: 0; top: 0; width: 1.8cqw; height: 1.8cqw; margin: -.9cqw; border-radius: 50%; background: var(--paper); opacity: 0; }
.on .dot { animation: dotin .4s calc(var(--i) * .008s) both, conv 1.4s cubic-bezier(.6,0,.2,1) .8s both; }
@keyframes dotin { from { opacity: 0; } to { opacity: .8; } }
@keyframes conv { from { transform: translate(var(--x0), var(--y0)); } to { transform: translate(var(--x1), var(--y1)); } }
.ring { position: absolute; left: 30cqw; top: 19cqw; width: 24cqw; height: 24cqw; border: .5cqw solid var(--paper); border-radius: 50%; opacity: 0; }
.on .ring { animation: rise .5s 2.1s both; }
.ringlbl { position: absolute; left: 0; width: 84cqw; text-align: center; top: 46cqw; font-family: var(--f-mono); font-size: 3.06cqw; letter-spacing: .2em; text-transform: uppercase; opacity: 0; }
.on .ringlbl { animation: rise .5s 2.5s both; }
/* method steps: a true sequence, so numbered */
.steps { display: grid; width: 100%; }
.step { display: grid; grid-template-columns: 16cqw 1fr; gap: 3cqw; align-items: center; padding: 6cqw 0; border-top: 1px solid var(--line); opacity: 0; }
.step b { font-family: var(--f-mono); font-size: 7.20cqw; line-height: 1; font-weight: 600; }
.step h3 { font-family: var(--f-display); font-size: 5.60cqw; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.step p { margin: 0; font-size: 3.33cqw; line-height: 1.35; color: var(--muted); }
.on .step { animation: rise .5s cubic-bezier(.2,.8,.2,1) var(--d) both, dim .5s var(--n) both; }
@keyframes dim { from { opacity: 1; } to { opacity: .5; } }
.on .step.last { animation: rise .6s cubic-bezier(.2,.8,.2,1) var(--d) both; }
/* offer rows */
.offers { display: grid; gap: 4cqw; width: 100%; }
.offer { border-left: 1.2cqw solid var(--paper); padding: 1cqw 0 1cqw 4.4cqw; }
.offer h3 { font-family: var(--f-display); font-size: 6.72cqw; margin: 0 0 1.2cqw; line-height: 1; letter-spacing: -.02em; }
.offer p { margin: 0; font-size: 3.36cqw; color: var(--muted); line-height: 1.3; }
.mini { font-family: var(--f-mono); font-size: 3.24cqw; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.cta { font-size: 3.68cqw; line-height: 1.3; max-width: 74cqw; }
.pill { font-family: var(--f-mono); font-size: 2.88cqw; letter-spacing: .14em; text-transform: uppercase; border: 1px solid var(--paper); border-radius: 10cqw; padding: 2.2cqw 4.6cqw; }

/* transport (not part of the video) */
.ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctl button { font: 600 13px var(--f-body); color: var(--paper); background: var(--ink-2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 14px; cursor: pointer; }
.ctl button:hover { border-color: var(--accent); }
.ctl button:focus-visible, .ctl input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sel { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sel select { font: 600 13px var(--f-body); color: var(--paper); background: var(--ink-2); border: 1px solid var(--line); border-radius: 4px; padding: 7px 8px; }
.ctl input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
.note { font-size: 12px; color: var(--muted); }
.render .ctl, .render .note { display: none; }
.render body { padding: 0; }
.render .page { max-width: none; display: block; }
.render .frame { max-height: none; border: 0; border-radius: 0; aspect-ratio: auto; width: 1080px; height: 1920px; }

/* slow motion: long decelerating reveals for the logo and key lines */
.logowrap { display: grid; justify-items: center; align-items: center; }
.logowrap > * { grid-area: 1 / 1; }
.on .logo.pop { animation: popslow 2.8s cubic-bezier(.16,.84,.3,1) both, drift 14s linear 2.8s both; }
@keyframes popslow {
  0% { opacity: 0; transform: scale(1.3); filter: blur(7cqw) drop-shadow(0 0 10cqw rgba(255,255,255,.45)); }
  60% { opacity: 1; }
  100% { opacity: 1; transform: scale(1); filter: blur(0) drop-shadow(0 0 3cqw rgba(255,255,255,.28)); }
}
@keyframes drift { from { transform: scale(1); } to { transform: scale(1.05); } }
.logo.ghost { opacity: 0; filter: blur(1.8cqw); }
.on .logo.ghost { animation: ghost 3.4s cubic-bezier(.2,.7,.3,1) .5s both; }
@keyframes ghost { 0% { opacity: 0; transform: scale(1); } 18% { opacity: .26; } 100% { opacity: 0; transform: scale(1.5); } }
.slow { opacity: 0; }
.on .slow { animation: slowtext 2.2s cubic-bezier(.16,.84,.3,1) var(--d, 0s) both; }
@keyframes slowtext { from { opacity: 0; transform: translateY(1.8cqw) scale(1.05); filter: blur(1.4cqw); } to { opacity: 1; transform: none; filter: blur(0); } }
@media (prefers-reduced-motion: reduce) { .on .logo.pop, .on .logo.ghost, .on .slow { animation-duration: 0.01s !important; animation-delay: 0s !important; } }

.on .logowrap { animation: logoout .9s cubic-bezier(.5,0,.8,.3) var(--o, 99s) both; }
@keyframes logoout { from { opacity: 1; transform: none; filter: blur(0); } to { opacity: 0; transform: scale(1.12); filter: blur(2.4cqw); } }

/* bilingual decode: Spanish decodes in, then the English line decodes right after */
.dl { display: block; white-space: pre; }
.dl.en { font-family: var(--f-display); font-weight: 500; font-size: .56em; line-height: 1.15; color: var(--muted); letter-spacing: 0; margin-top: .55em; }
.dl.inline { display: inline; margin: 0; }
.step .dl.en { font-family: var(--f-body); font-weight: 400; font-size: 3.33cqw; margin-top: 1.2cqw; line-height: 1.3; }
.mini .dl.en { font-family: var(--f-mono); font-size: .86em; letter-spacing: .12em; margin-top: .5em; color: #7b7b7b; font-weight: 400; }
.pill .dl.en { font-family: var(--f-mono); font-size: .8em; letter-spacing: .12em; margin-top: .35em; font-weight: 400; opacity: .75; color: var(--paper); }
.cta .dl.en { font-family: var(--f-body); font-size: .8em; margin-top: .45em; font-weight: 400; }
.brand .dl.en { font-family: var(--f-mono); font-size: .9em; letter-spacing: .2em; margin-top: .4em; font-weight: 400; color: #777; }
.offer h3 .dl.en { font-family: var(--f-body); font-size: .5em; letter-spacing: .02em; margin-left: .7em; vertical-align: .25em; font-weight: 500; }

.ringlbl .dl.en { font-family: var(--f-mono); font-size: .85em; letter-spacing: .14em; margin-top: .4em; color: #7b7b7b; font-weight: 400; }

/* opening v4: text first, small fast logo, promise before 3 s */
.hook { font-size: 8.40cqw; max-width: 84cqw; }
.on .hook { animation: snap .35s cubic-bezier(.2,.8,.2,1) both; }
@keyframes snap { from { transform: scale(1.08); } to { transform: none; } }
.on[data-name="Gancho"] .logo.pop { animation: popslow 1.2s cubic-bezier(.16,.84,.3,1) both, drift 14s linear 1.2s both; }
.on[data-name="Gancho"] .logo.ghost { animation: ghost 1.8s cubic-bezier(.2,.7,.3,1) .15s both; }
.promise { border-top: 1px solid var(--line); padding-top: 3.4cqw; margin-top: 1cqw; width: 70cqw; text-align: center; }
.promise .dl.es { font-family: var(--f-display); font-weight: 800; font-size: 5.4cqw; letter-spacing: -.01em; line-height: 1.05; }
.promise .dl.en { font-size: 3.6cqw; margin-top: .5em; }
</style>

    var gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, "rgba(" + rgb + "," + a + ")"); gr.addColorStop(1, "rgba(" + rgb + ",0)");
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function drawBg(ms) {
    var t = ms / 1000;
    stage.setAttribute("data-bg", BG);
    if (BG === "galaxy") {
      g.fillStyle = "#000"; g.fillRect(0, 0, 1080, 1920);   // true black for OLED
      // distant nebula (barely there, keeps the OLED black) and one slow far-off glint
      var br = Math.sin(6.283 * t / 15);
      blob(790 + 8 * br, 430 + 5 * br, 640 + 20 * br, "150,150,190", .040);
      blob(230 - 6 * br, 1390 - 4 * br, 720 + 24 * br, "110,130,170", .030);
      blob(560, 1000 + 6 * br, 560, "140,140,140", .015);
      var gl = Math.pow(.5 + .5 * Math.sin(6.283 * t / 15 - 1.2), 5);
      blob(330 + 8 * br, 300 + 5 * br, 60 + 30 * gl, "210,200,255", .025 + .10 * gl);
      // far layer: many faint, tiny stars that barely move, which gives the field depth
      for (var d = 0; d < dust.length; d++) {
        var q = dust[d], uu = (t / 15 + q.u0) % 1;
        var ee = Math.min(1, uu / .05, (1 - uu) / .05), cs = 1 + .075 * q.z * uu;
        var qx = 540 + (q.x - 540) * cs + 12 * q.z * Math.sin(6.283 * t / 15);
        var qy = 900 + (q.y - 900) * cs + 8 * q.z * Math.sin(6.283 * t / 15 + 1);
        var qa = q.a * (.45 + .55 * (.5 + .5 * Math.sin(6.283 * t / q.per + q.ph))) * ee;
        if (qa < .01) continue;
        g.fillStyle = "rgba(" + q.hue + "," + qa + ")";
        g.beginPath(); g.arc(qx, qy, q.r, 0, 6.283); g.fill();
      }
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var v = .5 + .5 * Math.sin(6.283 * t / s.per + s.ph);
        var b = .06 + .94 * Math.pow(v, 3);            // slow, soft pulse
        // depth: slow forward flight. Each star drifts outward from the vanishing point,
        // faster when near; one full cycle = 30 s so the loop is seamless.
        var u = (t / 15 + s.u0) % 1, env = Math.min(1, u / .05, (1 - u) / .05);
        env = env * env * (3 - 2 * env);
        var sc = 1 + .075 * s.z * u;
        var px = 540 + (s.x - 540) * sc + 12 * s.z * Math.sin(6.283 * t / 15);
        var yy = 900 + (s.y - 900) * sc + 8 * s.z * Math.sin(6.283 * t / 15 + 1);
        if (env < .01 || px < -20 || px > 1100 || yy < -20 || yy > 1940) continue;
        g.globalAlpha = env;
        if (s.big) {
          // smaller body, sharper flash: peak is brief and strong
          var f = Math.pow(v, 6), L = 2.5 + 8.5 * f, D = L * .55;
          g.lineCap = "round"; g.lineWidth = .9;
          g.strokeStyle = "rgba(" + s.hue + "," + (.15 + .85 * f) + ")";
          g.beginPath(); g.moveTo(px - L, yy); g.lineTo(px + L, yy); g.moveTo(px, yy - L); g.lineTo(px, yy + L); g.stroke();
          g.strokeStyle = "rgba(" + s.hue + "," + (.7 * f) + ")"; g.lineWidth = .8;
          g.beginPath(); g.moveTo(px - D, yy - D); g.lineTo(px + D, yy + D); g.moveTo(px - D, yy + D); g.lineTo(px + D, yy - D); g.stroke();
          blob(px, yy, 6 + 8 * f, s.hue, .12 + .55 * f);
          g.fillStyle = "rgba(255,255,255," + (.35 + .65 * f) + ")";
          g.beginPath(); g.arc(px, yy, .7 + .5 * f, 0, 6.283); g.fill();
          g.globalAlpha = 1;
          continue;
        }
        g.fillStyle = "rgba(" + s.hue + "," + b + ")";
        g.beginPath(); g.arc(px, yy, s.r * (.7 + .6 * b), 0, 6.283); g.fill();
        g.globalAlpha = 1;
      }
      for (var k = 0; k < shooters.length; k++) {
        var h = shooters[k], p = (t - h.t) / h.d;
        if (p < 0 || p > 1) continue;
        var al = Math.sin(Math.PI * p), dist = 760 * (1 - Math.pow(1 - p, 2));
        var hx = h.x + h.dx * dist, hy = h.y + h.dy * dist, tl = 300 * al + 60;
        var tx = hx - h.dx * tl, ty = hy - h.dy * tl;
        var gr = g.createLinearGradient(tx, ty, hx, hy);
        gr.addColorStop(0, "rgba(233,239,255,0)"); gr.addColorStop(1, "rgba(255,255,255," + al + ")");
        g.strokeStyle = gr; g.lineWidth = 3.4; g.lineCap = "round";
        g.beginPath(); g.moveTo(tx, ty); g.lineTo(hx, hy); g.stroke();
        blob(hx, hy, 26, "233,239,255", al * .7);
      }
    } else if (BG === "aurora") {
      g.fillStyle = "#08111f"; g.fillRect(0, 0, 1080, 1920);
      blob(300 + 160 * Math.sin(t / 5), 500 + 120 * Math.cos(t / 6), 760, "40,220,170", .22);
      blob(800 + 140 * Math.cos(t / 7), 1000 + 160 * Math.sin(t / 5), 820, "120,90,255", .22);
      blob(420 + 120 * Math.sin(t / 4), 1600 + 100 * Math.cos(t / 7), 760, "60,150,255", .18);
    } else {
      g.fillStyle = "#131c30"; g.fillRect(0, 0, 1080, 1920);
    }
  }

  // logo echo: wrap each logo and add a ghost copy that expands and fades in slow motion
  document.querySelectorAll("img.logo.pop").forEach(function (img) {
    var wrap = document.createElement("div"); wrap.className = "logowrap";
    var ghost = img.cloneNode(false); ghost.className = "logo ghost" + (img.classList.contains("sm") ? " sm" : ""); ghost.alt = "";
    img.parentNode.insertBefore(wrap, img); wrap.appendChild(ghost); wrap.appendChild(img);
    wrap.style.setProperty("--o", (+img.closest(".scene").dataset.dur / 1000 - .9) + "s");
  });

  // decode effect: pure function of time, so video frames match the preview
  var POOL = "01<>/\\#%&$*+=?!ABCDEFGHJKLNPQRSTUVXYZ";
  function hsh(a, b) { var h = Math.imul(a + 374761393, 668265263) ^ Math.imul(b + 1013904223, 2246822519); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
  var reduceDec = !window.__RENDER && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  scenes.forEach(function (sc) {
    sc._dl = [].slice.call(sc.querySelectorAll(".dl")).map(function (el) {
      el._t = el.getAttribute("data-t").split("|").join("\n");
      el._s = parseFloat(el.getAttribute("data-s"));
      el._d = parseFloat(el.getAttribute("data-d") || ".8");
      el.textContent = el._t; el._o = el._t; el.style.visibility = "hidden"; el._v = "hidden";
      return el;
    });
  });
  function decode(el, ts) {
    var p = reduceDec ? 1 : (ts - el._s) / el._d, t = el._t, out = t, vis = "visible";
    if (p <= 0) vis = "hidden";
    else if (p < 1) {
      var n = t.length, frame = Math.floor(ts * 14), s = "";
      for (var k = 0; k < n; k++) {
        var c = t.charAt(k);
        if (/[\s·.,?!¿¡'’:;\-]/.test(c)) { s += c; continue; }
        var th = .8 * k / Math.max(1, n - 1) + .15 * hsh(k, 7);
        s += p >= th ? c : POOL.charAt(Math.floor(hsh(k, frame) * POOL.length));
      }
      out = s;
    }
    if (out !== el._o) { el.textContent = out; el._o = out; }
    if (vis !== el._v) { el.style.visibility = vis === "hidden" ? "hidden" : ""; el._v = vis; }
  }

  var cur = -1;
  // Deterministic: the whole reel is a pure function of t (ms).
  function seek(t) {
    t = Math.max(0, Math.min(t, total - 1));
    var i = scenes.length - 1;
    while (starts[i] > t) i--;
    if (i !== cur) {
      scenes.forEach(function (s, k) { s.classList.toggle("on", k === i); if (k !== i) s.style.opacity = "0"; });
      cur = i;
    }
    drawBg(t);
    var local = t - starts[i], dur = +scenes[i].dataset.dur;
    scenes[i]._dl.forEach(function (el) { decode(el, local / 1000); });
    scenes[i].getAnimations({ subtree: true }).forEach(function (a) { a.pause(); a.currentTime = local; });
    var fade = (i === 0 ? 1 : Math.min(1, local / 250)) * Math.min(1, (dur - local) / 250);
    scenes[i].style.opacity = String(Math.max(0, Math.min(1, fade)));
    segs.forEach(function (b, k) { b.style.transform = "scaleX(" + (k < i ? 1 : k === i ? local / dur : 0) + ")"; });
  }
  window.__seek = seek;
  window.__total = total;

  function fit() {
    var k = frame.clientWidth / 1080;
    stage.style.transform = "scale(" + k + ")";
  }
  fit();
  window.addEventListener("resize", fit);
  if (RENDER) { seek(0); return; }

  var aud = document.getElementById("aud");
  var playBtn = document.getElementById("play");
  var sndBtn = document.getElementById("snd");
  var range = document.getElementById("seek");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var t = reduce ? 1600 : 0, playing = !reduce, sound = false, last = 0;

  function syncAudio() {
    if (!sound) return;
    if (Math.abs(aud.currentTime * 1000 - t) > 200) { try { aud.currentTime = t / 1000; } catch (e) {} }
  }
  function frameStep(now) {
    if (last && playing) {
      t += now - last;
      if (t >= total) { t = 0; if (sound) { try { aud.currentTime = 0; } catch (e) {} } }
      syncAudio();
    }
    last = now;
    seek(t);
    range.value = Math.round(t / total * 1000);
    requestAnimationFrame(frameStep);
  }
  playBtn.addEventListener("click", function () {
    playing = !playing; playBtn.textContent = playing ? "Pausa" : "Reproducir";
    if (sound) { if (playing) { syncAudio(); aud.play().catch(function () {}); } else aud.pause(); }
  });
  sndBtn.addEventListener("click", function () {
    sound = !sound;
    sndBtn.textContent = sound ? "Silenciar" : "Activar sonido";
    sndBtn.setAttribute("aria-pressed", String(sound));
    if (sound) { try { aud.currentTime = t / 1000; } catch (e) {} if (playing) aud.play().catch(function () { sound = false; sndBtn.textContent = "Activar sonido"; }); }
    else aud.pause();
  });
  range.addEventListener("input", function () {
    t = range.value / 1000 * total;
    if (sound) { try { aud.currentTime = t / 1000; } catch (e) {} }
  });
  document.getElementById("bgsel").addEventListener("change", function (e) { BG = e.target.value; });
  if (!playing) playBtn.textContent = "Reproducir";
  requestAnimationFrame(frameStep);
})();
</script>
