<div class="wcard" style="background:{{ p.background_color }};color:{{ p.foreground_color }}">
  <div class="wtop">
    <img src="{% url 'passes:image' p.pk 'logo@3x.png' %}" alt="" width="34" height="34">
    <span class="wlogo">{{ p.logo_text }}</span>
  </div>
  <div class="wstrip" style="background-image:url('{% url 'passes:image' p.pk 'strip@3x.png' %}')">
    <div><small style="color:{{ p.label_color }}">MIEMBRO</small><div class="wprimary">{{ p.member_name }}</div></div>
  </div>
  <div class="wrow">
    {% if p.level %}<div><small style="color:{{ p.label_color }}">NIVEL</small><div>{{ p.level }}</div></div>{% endif %}
    {% if p.member_since %}<div><small style="color:{{ p.label_color }}">MIEMBRO DESDE</small><div>{{ p.member_since }}</div></div>{% endif %}
    <div><small style="color:{{ p.label_color }}">ID</small><div>{{ p.member_id }}</div></div>
  </div>
</div>
<style>
  .wcard, .wcard div { color:inherit; }
  .wcard { width:100%; max-width:340px; border-radius:14px; overflow:hidden; box-shadow:0 6px 24px rgba(0,0,0,.25); }
  .wtop { display:flex; align-items:center; gap:8px; padding:10px 12px; }
  .wlogo { font-weight:600; letter-spacing:.04em; }
  .wstrip { aspect-ratio:375/123; background-size:cover; display:flex; align-items:flex-end; padding:10px 12px; }
  .wprimary { font-size:1.5rem; font-weight:300; }
  .wrow { display:flex; gap:18px; padding:10px 12px 14px; flex-wrap:wrap; }
  .wcard small { font-size:.65rem; letter-spacing:.06em; font-weight:600; }
</style>
