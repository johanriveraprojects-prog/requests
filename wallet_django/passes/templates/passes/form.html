{% extends "passes/base.html" %}
{% block title %}Nuevo pase{% endblock %}
{% block content %}
<h1>Nuevo pase</h1>
<form method="post" enctype="multipart/form-data" class="panel">
  {% csrf_token %}
  {{ form.as_p }}
  <p class="muted">Si no subes logo ni franja se generan automáticamente con tus colores e iniciales.</p>
  <button class="btn" type="submit">Crear pase</button>
</form>
{% endblock %}
